# Spec 002, FR-024 and FR-025: the PC checks on a change under pc/ or shared/, and the Android
# job (spec 004, T405: the core tests and the debug APK) on a change under android/ or shared/. A change elsewhere (docs/, specs/) runs
# nothing. Replay mode only: no network calls to providers and no keys.
name: CI

on:
  push:
    paths: ["pc/**", "shared/**", "android/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["pc/**", "shared/**", "android/**", ".github/workflows/ci.yml"]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      pc: ${{ steps.filter.outputs.pc }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pc: ["pc/**", "shared/**", ".github/workflows/ci.yml"]
            android: ["android/**", "shared/**", ".github/workflows/ci.yml"]

  pc:
    needs: changes
    if: needs.changes.outputs.pc == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EPIC_PROVIDER_MODE: replay
    defaults:
      run:
        working-directory: epic-replay/pc
    steps:
      - uses: actions/checkout@v4
        with:
          path: epic-replay
      # openjiuwen is installed from a checkout with --no-deps: its intelli-router dependency is
      # a git URL that pip and uv refuse (001 quickstart.md section 2). This is the commit the
      # owner's machine runs (0.1.19).
      - uses: actions/checkout@v4
        with:
          repository: openJiuwen-ai/agent-core
          ref: ab825d17a2e729b9067c5057cce5c27bd792aa82
          path: agent-core
      - uses: astral-sh/setup-uv@v6
      - name: FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-noto-cjk
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -r requirements-ci.txt
          uv pip install -e ../../agent-core --no-deps
          uv pip install -e ".[dev]" --no-deps
          .venv/bin/playwright install --with-deps chromium
      - name: Ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Tests
        run: .venv/bin/pytest -q

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The build turns the shared .woff2 fonts into TrueType with fonttools (spike S2).
      - name: Font tools
        run: |
          python3 -m venv "$RUNNER_TEMP/fontvenv"
          "$RUNNER_TEMP/fontvenv/bin/pip" install -r tools/requirements.txt
          echo "EPIC_PYTHON=$RUNNER_TEMP/fontvenv/bin/python" >> "$GITHUB_ENV"
      # Gradle installs the platform and build tools it needs once their licences are accepted.
      - name: Accept Android SDK licences
        run: |
          set +e +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > "$RUNNER_TEMP/licences.log" 2>&1
          status=${PIPESTATUS[1]}   # sdkmanager's own exit status; `yes` ends when the pipe closes
          tail -n 3 "$RUNNER_TEMP/licences.log"
          test "$status" -eq 0 && test -s "$ANDROID_HOME/licenses/android-sdk-license"
      - name: Core tests and debug APK
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
