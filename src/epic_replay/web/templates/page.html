<!doctype html>
<html lang="en" style="--accent:{{ accents.accent }};--on-accent:{{ accents.on_accent }};--accent-text:{{ accents.accent_text }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ copy.WORDMARK }}</title>
<link rel="stylesheet" href="/static/page.css">
</head>
<body>
{% if demo %}<div class="demo-band label">{{ copy.DEMO.format(date=demo) }}</div>{% endif %}
<header class="top">
  <a class="wordmark" href="/" aria-label="{{ copy.WORDMARK }}, start over">
    <svg viewBox="0 0 30 20" aria-hidden="true"><path d="M15 0v20L0 10zM30 0v20L15 10z"/></svg>
    {{ copy.WORDMARK }}
  </a>
  <div id="who">{% include "_who.html" %}</div>
</header>
<div class="ruler" aria-hidden="true"></div>
<p class="sr-only" id="announce" aria-live="polite"></p>
<p class="error notice" id="notice" role="alert"></p>
<main id="main">
{% include "_main.html" %}
</main>
<script src="/static/page.js"></script>
</body>
</html>
